---
# Codacy configuration.
#
# Note: Codacy only reads this file when "Use configuration file" is enabled
# in the repository's Codacy settings. If findings below still appear, that
# toggle is off in the dashboard.
#
# Nothing here reduces real coverage. Linting and typing are enforced in CI by
# ruff (a large rule set, including bandit's S rules and pytest-style checks)
# and by mypy. These exclusions remove duplicate or incorrect reporting only.
exclude_paths:
  - "docs/**"
  - "examples/**"
  - "images/**"
  - "**/*.md"
  # Codacy does not recognise this directory as test code. Bandit reports every
  # pytest assertion as a security finding (B101) and pylint flags every test
  # taking a fixture as "redefining name from outer scope". Both are false
  # positives that buried the real findings; ruff lints these files instead.
  - "tests/**"

engines:
  bandit:
    exclude_paths:
      - "tests/**"
  pylint:
    exclude_paths:
      - "tests/**"
  # This project uses Google-style docstrings, enforced by ruff's pydocstyle
  # with convention = "google". Codacy's copy defaults to the numpy convention
  # and reports the differences between the two styles as errors.
  pydocstyle:
    enabled: false
