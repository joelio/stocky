name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag above v7, so this is
      # pinned to an exact release rather than a moving ref.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag above v7, so this is
      # pinned to an exact release rather than a moving ref.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - run: uv sync --group dev

      # Integration tests need real API keys, so they are deselected here.
      # Run them locally with `pytest -m integration`.
      - name: Run tests
        run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag above v7, so this is
      # pinned to an exact release rather than a moving ref.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      # Catches a broken console script or a package that ships without its
      # modules — neither of which the unit tests would notice.
      - name: Smoke-test the installed console script
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | uvx --from dist/*.whl stocky-mcp 2>/dev/null > handshake.json
          cat handshake.json
          grep -q '"serverInfo"' handshake.json

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
