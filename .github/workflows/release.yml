name: Release

# Publishing is deliberately manual: it only runs when a version tag is
# pushed, or when triggered by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag above v7, so this is
      # pinned to an exact release rather than a moving ref.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # A protected environment means a human approves each publish.
    environment:
      name: pypi
      url: https://pypi.org/p/stocky-mcp
    permissions:
      # Required for Trusted Publishing. No API token is stored anywhere:
      # PyPI verifies this workflow's OIDC identity instead. Configure the
      # publisher once at https://pypi.org/manage/account/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
